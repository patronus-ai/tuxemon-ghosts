<!doctype html>
<html><head><meta charset="utf-8"><title>Tuxemon — ghost</title>
<style>
  body { margin:0; background:#101820; color:#e2e8e6;
         font:16px/1.5 system-ui, sans-serif; display:grid;
         place-items:center; height:100vh }
  canvas { image-rendering:pixelated; outline:none;
           border:1px solid #2b3843 }
  #start { padding:.8rem 1.6rem; font:inherit; cursor:pointer }
  #status { font-family:ui-monospace, monospace; font-size:.8rem;
            color:#93a2a8 }
</style></head>
<body>
<div>
  <button id="start">Click to start</button>
  <p id="status">Pyodide takes about 7 seconds to boot.</p>
  <canvas id="canvas" width="1280" height="720" tabindex="0"
          hidden></canvas>
</div>
<script src="https://cdn.jsdelivr.net/pyodide/v0.29.1/full/pyodide.js"></script>
<script>
// The canvas must hold FOCUS for keyboard events to reach pygame --
// Emscripten's SDL delivers DOM key events into pygame.event directly,
// which is why there is no input code anywhere in this build.
const status = (t) => document.getElementById("status").textContent = t;
document.getElementById("start").onclick = async (ev) => {
  ev.target.disabled = true;
  try {
    status("loading pyodide...");
    const pyodide = await loadPyodide();
    status("loading pygame...");
    await pyodide.loadPackage(["micropip", "pygame-ce"]);
    const mp = pyodide.pyimport("micropip");
    status("installing dependencies...");
    for (const d of ["pydantic","pyyaml","pytmx","pyscroll","natsort",
                     "babel","requests","packaging","prompt_toolkit",
                     "pygame-menu-ce","websockets","pillow"]) {
      await mp.install(d);
    }
    status("unpacking game...");
    for (const f of ["code.zip", "mods.zip", "fixtures.zip"]) {
      const buf = await (await fetch(f)).arrayBuffer();
      await pyodide.unpackArchive(buf, "zip", { extractDir: "/game" });
    }
    const canvas = document.getElementById("canvas");
    canvas.hidden = false;
    pyodide.canvas.setCanvas2D(canvas);
    canvas.focus();
    status("arrow keys to move · Enter to interact");
    await pyodide.runPythonAsync(`
import sys, os
sys.path.insert(0, "/game"); os.chdir("/game")
from pathlib import Path
import tuxghost.web as web
await web.main(Path("fixtures/paper_town.save"),
               Path("fixtures/ghost.tuxghost"),
               seed=1234, clock_epoch=1787659200)
`);
  } catch (e) { status("failed: " + e); throw e; }
};
</script></body></html>
