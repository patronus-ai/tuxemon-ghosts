<!doctype html>
<html><head><meta charset="utf-8"><title>Tuxemon — browser build</title>
<style>
  body { margin:0; background:#101820; color:#e2e8e6;
         font:16px/1.5 system-ui, sans-serif; display:grid;
         place-items:center; height:100vh }
  canvas { image-rendering:pixelated; outline:none;
           border:1px solid #2b3843 }
  #start { padding:.8rem 1.6rem; font:inherit; cursor:pointer }
  #status { font-family:ui-monospace, monospace; font-size:.8rem;
            color:#93a2a8 }
  body.embed #shell { width:100vw; height:100vh }
  body.embed #start, body.embed #status, body.embed #fps { display:none }
  body.embed canvas { width:100%; height:100%; border:0; display:block }
</style></head>
<body>
<div id="shell">
  <button id="start">Click to start</button>
  <p id="status">Pyodide takes about 7 seconds to boot.</p>
  <p id="fps"></p>
  <canvas id="canvas" width="1280" height="720" tabindex="0"
          hidden></canvas>
</div>
<script src="https://cdn.jsdelivr.net/pyodide/v0.29.1/full/pyodide.js"></script>
<script>
// The canvas must hold FOCUS for keyboard events to reach pygame --
// Emscripten's SDL delivers DOM key events into pygame.event directly,
// which is why there is no input code anywhere in this build.
const status = (t) => document.getElementById("status").textContent = t;
const embed = new URLSearchParams(location.search).get("embed") === "1";
if (embed) document.body.classList.add("embed");
const postToHost = (type, detail = {}) => {
  if (!embed) return;
  parent.postMessage({ source: "tuxemon-pyodide", type, ...detail }, location.origin);
};
let pyodide = null;
let prepared = false;
let running = false;

// The manual acceptance requires a MEASURED, READABLE frame rate ("at
// least 30fps sustained over 10 seconds of walking"). ROUND 1 of this
// review shipped a `requestAnimationFrame` counter here -- rejected on
// re-review: it ticks at the BROWSER's paint rate, which keeps going
// even if the Python game loop stalls completely, so it could read a
// healthy 60 on a frozen build. This build instead polls
// `tuxghost.web.measured_rate`, a number the game loop itself computes
// as its own real steps-taken-per-real-second (see `web.py`'s
// `main`) -- it IS the loop's progress, not a proxy for it, so it
// drops to 0 the instant the loop stops making progress, whatever the
// browser is doing on screen. Polling (not a callback from Python)
// keeps `web.py` free of any browser-specific code beyond its one
// documented `await`.
let fpsInterval = null;
function startFpsPoller(pyodide) {
  fpsInterval = setInterval(() => {
    let rate;
    try {
      // Re-`import`ing is a cheap no-op once `tuxghost.web` is already
      // in `sys.modules` -- this only does real work on the tick or two
      // before the game script's own `import tuxghost.web as web` line
      // has run, and is otherwise how this poller reads the module's
      // live state without web.py ever reaching back into JS itself.
      rate = pyodide.runPython(
        "import tuxghost.web as web; web.measured_rate"
      );
    } catch (e) {
      return; // tuxghost.web isn't importable yet -- try again next tick
    }
    document.getElementById("fps").textContent = `${rate.toFixed(1)} steps/sec`;
  }, 1000);
}

async function prepare() {
  if (prepared) return;
  try {
    status("loading pyodide...");
    pyodide = await loadPyodide();
    status("loading pygame...");
    await pyodide.loadPackage(["micropip", "pygame-ce"]);
    const mp = pyodide.pyimport("micropip");
    status("installing dependencies...");
    for (const d of ["pydantic","pyyaml","pytmx","pyscroll","natsort",
                     "babel","requests","packaging","prompt_toolkit",
                     "pygame-menu-ce","websockets","pillow"]) {
      await mp.install(d);
    }
    status("unpacking game...");
    for (const f of ["code.zip", "mods.zip"]) {
      const buf = await (await fetch(f)).arrayBuffer();
      await pyodide.unpackArchive(buf, "zip", { extractDir: "/game" });
    }
    const canvas = document.getElementById("canvas");
    canvas.hidden = false;
    pyodide.canvas.setCanvas2D(canvas);
    canvas.focus();
    status("arrow keys to move · Enter to interact");
    startFpsPoller(pyodide);
    console.time("tuxemon-cold-boot");
    await pyodide.runPythonAsync(`
import sys, os
sys.path.insert(0, "/game"); os.chdir("/game")
import tuxghost.web as web
_speedrun_state = web.boot_cold(seed=1234, clock_epoch=1787659200)
web.step_once(_speedrun_state, 0)
`);
    console.timeEnd("tuxemon-cold-boot");
    prepared = true;
    postToHost("ready");
  } catch (e) {
    status("failed: " + e);
    postToHost("failed", { reason: String(e) });
    throw e;
  }
}

async function startRun() {
  if (!prepared || running) return;
  running = true;
  const canvas = document.getElementById("canvas");
  canvas.focus();
  postToHost("started");
  try {
    const elapsed = await pyodide.runPythonAsync(`
await web.run(_speedrun_state, stop_on_gym_entry=True)
`);
    if (elapsed !== null && elapsed !== undefined) {
      postToHost("completed", { elapsedMs: Number(elapsed) * 1000 });
    } else {
      postToHost("failed", { reason: "Tuxemon stopped before the first gym was entered" });
    }
  } catch (e) {
    postToHost("failed", { reason: String(e) });
    throw e;
  }
}

document.getElementById("start").onclick = async (ev) => {
  ev.target.disabled = true;
  await prepare();
  await startRun();
};

window.addEventListener("message", (event) => {
  if (!embed || event.source !== parent || event.origin !== location.origin) return;
  if (event.data?.source === "speedrunbench-host" && event.data?.type === "start") {
    void startRun();
  }
});

if (embed) void prepare();
</script></body></html>
