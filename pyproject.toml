[project]
name = "tuxghost"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10.6"]

[project.optional-dependencies]
dev = ["pytest", "mypy", "ruff"]
agent = ["anthropic>=0.40"]

[tool.setuptools.packages.find]
include = ["tuxghost*"]

[tool.mypy]
strict = true
warn_unreachable = true
# tuxemon upstream is unannotated and not ours to fix
[[tool.mypy.overrides]]
module = "tuxemon.*"
ignore_missing_imports = true
follow_imports = "skip"

# The `anthropic` SDK is an OPTIONAL extra (`pip install -e .[agent]`):
# `ScriptedPolicy`/`ReplayPolicy` -- everything `make check` runs -- never
# import it, and requiring a network SDK to run the gate would be a
# needless coupling. `tuxghost/agent/claude.py` imports it lazily inside
# `decide()`, so mypy needs to be told the stubs may be absent rather than
# failing the strict gate on a dependency the gate does not install.
[[tool.mypy.overrides]]
module = "anthropic.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: drives a real game loop for minutes; opt-in"]
# Parked minor 7 (whole-branch review): forces "always" (never Python's
# default once-per-location dedup) specifically for the ambient
# patch_series_id mismatch warning `tuxghost/trace.py` emits on every
# `read()` of the committed golden trace. Without this, the warning's
# module+lineno never changes across call sites, so Python's default
# filter can silently suppress all but the first occurrence within a
# session -- exactly the kind of thing that would let a REAL regression
# (a warning that stops firing, or a new one that starts) hide among
# what looks like consistent, expected noise. `tests/conftest.py`'s
# `_patch_series_id_warning_tripwire` fixture is the thing that actually
# checks the count; this filter is what makes that count trustworthy.
filterwarnings = ["always:patch_series_id:UserWarning"]
